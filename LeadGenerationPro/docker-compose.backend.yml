services:
  kafka:
    image: apache/kafka:latest
    container_name: leadgen-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT_LOCAL://0.0.0.0:9092,PLAINTEXT_DOCKER://0.0.0.0:9093,CONTROLLER://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT_LOCAL://localhost:9092,PLAINTEXT_DOCKER://kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT_LOCAL:PLAINTEXT,PLAINTEXT_DOCKER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT_DOCKER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9094"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_NUM_PARTITIONS: "2"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ./lead_generation_backend
      dockerfile: Dockerfile.api
    container_name: leadgen-api
    env_file:
      - ./lead_generation_backend/.env
    environment:
      KAFKA_BOOTSTRAP: kafka:9093
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./lead_generation_backend
      dockerfile: Dockerfile.worker
    container_name: leadgen-worker
    env_file:
      - ./lead_generation_backend/.env
    environment:
      KAFKA_BOOTSTRAP: kafka:9093
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  status-updater:
    build:
      context: ./lead_generation_backend
      dockerfile: Dockerfile.status
    container_name: leadgen-status-updater
    env_file:
      - ./lead_generation_backend/.env
    environment:
      KAFKA_BOOTSTRAP: kafka:9093
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
