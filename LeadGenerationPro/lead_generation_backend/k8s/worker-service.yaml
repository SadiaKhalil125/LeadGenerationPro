apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  namespace: scraping-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: worker
        image: sadia2004/scraping-worker:latest
        imagePullPolicy: Always
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"    
        env:       
        - name: KAFKA_BOOTSTRAP
          value: "kafka-leadgenpro-lead-gen-pro.j.aivencloud.com:16246"
        - name: KAFKA_SECURITY_PROTOCOL
          value: "SASL_SSL"
        - name: KAFKA_SASL_MECHANISM
          value: "SCRAM-SHA-256"
        - name: KAFKA_SASL_USER
          valueFrom:
            secretKeyRef:
              name: aiven-kafka-sasl
              key: username
        - name: KAFKA_SASL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aiven-kafka-sasl
              key: password
        - name: KAFKA_CA_LOCATION
          value: "/etc/kafka-certs/ca.pem"
        - name: DB_HOST
          value: "leadgenerationdb.c1e42aci8a5v.eu-north-1.rds.amazonaws.com" 
        - name: DB_PORT
          value: "5432"
        - name: DB_USER
          value: "postgres" 
        - name: DB_NAME
          value: "postgres" 
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rds-credentials
              key: password
        volumeMounts:
        - name: kafka-certs
          mountPath: "/etc/kafka-certs"
          readOnly: true
      volumes:
      - name: kafka-certs
        secret:
          secretName: aiven-kafka-certs
          